<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠一括登録 | LMS</title>
</head>

<body>
	<div id="contents" class="clearfix">
		<div id="main" class="main2clm">
			<h2>勤怠一括登録</h2>

			<form method="post" th:action="@{/attendance/bulkRegist/search}" class="form-horizontal">
				<div class="well bs-component">
					<fieldset>
						<legend>検索</legend>
						<div class="form-group">
							<label for="placeName" class="col-lg-2 control-label">期間</label>
							<div class="col-lg-10 form-inline">
								<input type="text" name="searchPeriodFrom" id="searchFrom" style="width: 10em"
									class="form-control datepickerFrom"
									th:classappend="${errors != null
												 and (errors.containsKey('searchFromEmptyError')
												   or errors.containsKey('searchSettingOver'))}
												   ? 'errorInput' : ''"/>　～　
								<input type="text" name="searchPeriodTo" id="searchTo" style="width: 10em"
									class="form-control datepickerTo"
									th:classappend="${errors != null
												 and (errors.containsKey('searchToEmptyError')
												   or errors.containsKey('searchToRangeError')
												   or errors.containsKey('searchPeriodCompareError')
												   or errors.containsKey('searchSettingOver'))}
												   ? 'errorInput' : ''"/>
							</div>
						</div>

						<div class="form-group">
							<label for="placeName" class="col-lg-2 control-label">会場名</label>
							<div class="col-lg-10">
								<input type="text" name="placeName" id="placeName" th:value="${placeName}" disabled class="form-control">
								<input type="hidden" name="placeId" th:value="${placeId}" >
							</div>
						</div>

						<div class="form-group">
							<div class="col-lg-10 col-lg-offset-2">
								<input type="submit" name="search" value="検索" class="btn btn-primary" />
							</div>
						</div>
					</fieldset>
				</div>

				<th:block th:each="err : ${errors}">
					<div th:text="${err.value}" class="error-message"></div>
				</th:block>

				<table th:if="${isSearch}" class="table">
					<tbody  th:each="dailyAttendanceForm, startMap : ${dailyAttendanceFormMap}">
						<tr style="background-color: #f5f5f5; border-top-style: solid; border-width: medium;">
							<th colspan="7" th:text="${dailyAttendanceForm.key}"></th>
							<th colspan="2">
								<button type="button" th:value="${startMap.index}" class="btn btn-default copyAttendanceDaily">
									受講生が入力した時刻をコピーする
								</button>
							</th>
							<td>
								<button id="submit-btn" type="submit" th:value="${startMap.index}" class="btn btn-info"
									th:formaction="@{/attendance/bulkRegist/complete}">
									確定する
								</button>
							</td>
						</tr>
						<tr>
							<th style="width: 120px">ユーザー名</th>
							<th style="width: 190px">コース名</th>
							<th style="width: 90px">出勤</th>
							<th style="width: 90px">退勤</th>
							<th style="width: 90px">中抜け時間</th>
							<th style="width: 90px">ステータス</th>
							<th style="width: 50px">備考</th>
							<th style="width: 90px">開始時間</th>
							<th style="width: 90px">終了時間</th>
							<th style="width: 50px">欠席</th>
						</tr>

						<tr th:each="form, startForm : ${dailyAttendanceForm.value}">
							<td th:text="${form.userName} != null ? ${form.userName} : ''"></td>
							<td th:text="${form.courseName} != null ? ${form.courseName} : ''"></td>
							<td th:text="${form.trainingStartTime} != null ? ${form.trainingStartTime} : ''"></td>
							<td th:text="${form.trainingEndTime} != null ? ${form.trainingEndTime} : ''"></td>
							<td th:text="${form.blankTimeValue} != null ? ${form.blankTimeValue} : ''"></td>
							<td th:text="${form.statusDispName} != null ? ${form.statusDispName} : ''"></td>
							<td>
								<strong th:if="${form.note} != null "
									data-toggle="popover" data-placement="right" th:data-content="${form.note}" data-trigger="hover"
									data-original-title="" title="">あり</strong>
								<th:block th:if="${form.note} == null ">なし</th:block>
							</td>

							<input type="hidden"
								th:name="|dailyAttendanceList[${startForm.index}].trainingStartTime|"
								th:value="${form.trainingStartTime}" />
							<input type="hidden"
								th:name="|dailyAttendanceList[${startForm.index}].trainingEndTime|"
								th:value="${form.trainingEndTime}" />
							<input type="hidden"
								th:name="|dailyAttendanceList[${startForm.index}].status|"
								th:value="${form.status}" />
							<input type="hidden"
								th:name="|dailyAttendanceList[${startForm.index}].companyAttendanceId|"
								th:value="${form.companyAttendanceId}" />
							<input type="hidden"
								th:name="|dailyAttendanceList[${startForm.index}].studentAttendanceId|"
								th:value="${form.studentAttendanceId}" />
							<input type="hidden"
								th:name="|dailyAttendanceList[${startForm.index}].lmsUserId|"
								th:value="${form.lmsUserId}" />
							<input type="hidden"
								th:name="|dailyAttendanceList[${startForm.index}].trainingDate|"
								th:value="${form.trainingDate}" />

							<input type="hidden" th:value="${form.trainingStartTimeCopy}"
									th:class="'startTimeCompanyRounded' + ${startMap.index}" />
							<input type="hidden" th:value="${form.trainingEndTimeCopy}" 
									th:class="'endTimeCompanyRounded' + ${startMap.index}" />
							<td>
								<input type="text"
									th:class="'form-control startTimeCompany' + ${startMap.index}" />
							</td>
							<td>
								<input type="text"
									th:class="'form-control endTimeCompany' + ${startMap.index}" />
							</td>
							<td>
								<input type="checkbox" th:checked="${form.status} == 1" th:value="${form.status} == 1 ? on : off"
									class="attendanceFormControl" />
							</td>
						</tr>

					</tbody>
				</table>
			</form>
		</div>
		<!--#main-->
	</div>
	<script src="/lms/js/companyAttendance.js"></script>
</body>

</html>
